[project]
name = "agentic-ecommerce-api"
version = "0.1.0"
description = "FastAPI backend for the agentic AI e-commerce demo"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111,<0.112",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "pgvector>=0.3,<0.4",
    "scalar-fastapi>=1.8,<2",
    "email-validator>=2,<3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
# Alembic generates env.py + revision scripts; they don't benefit from strict typing.
exclude = ["alembic/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
