  <!-- Concept 6 "Tend" (wildcard): one continuous stroke that orbits and folds
       back over itself in a soft off-centre loop — attention that keeps coming
       back to you. Not a ring, not a face: an open, asymmetric single line with
       one warm thickening at the base of the fold. Tends, never encloses. -->
