           C13 38, 13 24, 27 20
           C41 16, 52 24, 50 36
           C48.5 45, 38 49, 31 44
           C25 39.7, 27 31, 35 30
           C40 29.3, 43 33, 41 37"
        stroke="currentColor" stroke-width="6.5" stroke-linecap="round"
        stroke-linejoin="round" fill="none"/>
</svg>
