<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Hearth">
  <!-- Concept 4 "Mantel": an unmistakable capital H. Two full rounded posts and
       a real crossbar so it reads as H FIRST. The one warm detail is a short
       tapered rise lifting off the crossbar's center — a restrained ember cut
       that never threatens legibility. -->
  <!-- left post -->
  <rect x="12" y="11" width="9" height="42" rx="4.5" fill="currentColor"/>
  <!-- right post -->
  <rect x="43" y="11" width="9" height="42" rx="4.5" fill="currentColor"/>
  <!-- crossbar -->
  <rect x="19" y="28" width="26" height="8" rx="4" fill="currentColor"/>
  <!-- warm detail: a small tapered rise lifting from the crossbar centre -->
  <path d="M30 28
           C30.5 23, 32 20, 32 15
           C34 19.5, 33.7 24, 34 28 Z"
        fill="currentColor"/>
</svg>
