name: CI

# Runs on PRs into dev and on pushes to integration branches.
# The lint / type-check / test / e2e / docker-build pipeline. As of W1 Day-7 the
# web + api lint, type-check, and test jobs run REAL commands against real code
# (US-QA-D07). docker-build stays a documented no-op until CI build minutes are
# tuned (the local docker-compose stack is proven in the integration dry run).
on:
  pull_request:
    branches: [dev]
  push:
    branches:
      - "integration/**"
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Web (Next.js / TypeScript) ------------------------------------------
  lint:
    name: lint (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint

  type-check:
    name: type-check (web)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install deps
        run: npm ci --no-audit --no-fund
      - name: tsc --noEmit
        run: npm run type-check

  # ---- API (FastAPI / Python) ----------------------------------------------
  lint-api:
    name: lint (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check .

  type-check-api:
    name: type-check (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Mypy (strict)
        run: mypy app

  # ---- API tests against a real pgvector Postgres --------------------------
  # The deferred Day-4 job, wired Day-7. Migration-contract + seed-resolve +
  # fixture-spine tests each CREATE/DROP a throwaway DB on this service, so the
  # service user must have createdb rights (postgres superuser does). The image
  # ships the `vector` extension that migration 0001 enables per throwaway DB.
  test-api:
    name: test (api)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        # `trust` auth: this service is ephemeral and only reachable from this job
        # on localhost, so it needs no password — which also keeps a credential
        # literal out of the repo (GitGuardian scans full history).
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: agentic_ecommerce
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The suite reads DATABASE_URL (and creates per-test throwaway DBs on this
      # server). No password — the service uses trust auth (see above). EMBED_DIM
      # drives the pgvector column dim in migration 0003.
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/agentic_ecommerce
      EMBED_DIM: "768"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install dev deps
        run: pip install -r requirements-dev.txt
      - name: Pytest
        # 24 pass + 6 xfail (per-persona /auth/login pending Week-2 auth handlers).
        run: pytest -q

  # ---- E2E smoke (Playwright harness) --------------------------------------
  e2e-smoke:
    name: e2e-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The @smoke specs assert + verify the env contract WITHOUT a running
      # web/api server. Real navigation specs (with a webServer block + browser
      # binaries) land when Iris builds the screens in Week 2.
      - name: Install e2e deps (no browsers)
        run: npm install --no-audit --no-fund
      - name: Run E2E smoke (no app server)
        run: npm run e2e:smoke

  # ---- Docker build (compose images) ---------------------------------------
  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Documented no-op: the full `docker compose up` stack (db + migrations +
      # seed + app boot) is proven in the W1 integration dry run. Wire
      # `docker compose build` here once CI build minutes/caching are tuned.
      - name: Docker build (placeholder)
        run: 'echo "TODO: docker compose build web api — proven locally in the W1 dry run."'

  # Aggregate gate so branch protection can require a single check.
  ci:
    name: ci
    runs-on: ubuntu-latest
    needs:
      - lint
      - type-check
      - lint-api
      - type-check-api
      - test-api
      - e2e-smoke
      - docker-build
    steps:
      - name: All checks passed
        run: echo "CI pipeline green."
